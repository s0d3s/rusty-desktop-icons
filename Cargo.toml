[workspace]
resolver = "3"
members = [
    "crates/rdi-core",
    "crates/rdi-platform-windows",
    "crates/rdi-platform-stub",
    "crates/rdi-python",
]

[workspace.package]
version = "0.2.30"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["s0d3s"]
repository = "https://github.com/s0d3s/rusty-desktop-icons"

[workspace.dependencies]
rdi-core = { path = "crates/rdi-core", version = "0.2.30" }
rdi-platform-windows = { path = "crates/rdi-platform-windows", version = "0.2.30" }
rdi-platform-stub = { path = "crates/rdi-platform-stub", version = "0.2.30" }

thiserror = "2.0.21"
crossbeam-channel = "0.5.17"
pyo3 = { version = "=0.29.2", features = ["extension-module", "experimental-inspect"] }

# Logging facade. Library crates (`rdi-core`, `rdi-platform-windows`)
# take ONLY this — never a subscriber.
tracing = "0.1.44"
# Subscriber. Leaf artifacts only: rdi-python, the demo bins, tests.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
]

# --- workspace-root demo binary ---------------------------------------------

[package]
name = "rusty-desktop-icons"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Demo CLI for the rusty-desktop-icons crates."
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
rdi-core.workspace = true
rand = "0.10.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
rdi-platform-windows.workspace = true
windows.workspace = true
# Ctrl+C handler for the `overlay_wiggle` diagnostic bin. Not used by
# any shipping library crate.
ctrlc = "3.5.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-textarea = "0.9.2"
arboard = { version = "3.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
