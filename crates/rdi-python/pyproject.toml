[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "rusty-desktop-icons"
version = "0.2.29"
description = "Rust-powered Windows desktop icon controller and animator."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "s0d3s" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Desktop Environment",
    "Development Status :: 3 - Alpha",
]
# The Rust side's `tracing` events are emitted through loguru, which
# imposes loguru on consumers.
dependencies = [
    "loguru>=0.7.3",
]

[project.urls]
Repository = "https://github.com/s0d3s/rusty-desktop-icons"

[tool.maturin]
module-name = "rusty_desktop_icons._rusty_desktop_icons"
python-source = "python"
exclude = ["**/*.pdb", "**/*.PDB", "**/*.ilk", "**/*.exp", "**/*.lib"]
