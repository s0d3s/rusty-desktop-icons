name: Library documentation

on:
  pull_request:
  push:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: uv.lock
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install uv==0.12.19
      - run: uv export --locked --only-group docs --no-emit-project --output-file target/uv-docs-requirements.txt
      - run: python -m pip install -r target/uv-docs-requirements.txt
      - run: python scripts/generate-stubs.py --check
      - run: python -m unittest discover -s scripts -p test_publication.py -v
      - run: python -m mypy --strict scripts/generate-stubs.py scripts/assemble-docs.py scripts/check-wheel.py scripts/test_publication.py
      - run: python -m mypy --strict crates/rdi-python/tests/typing/api.py
        env:
          MYPYPATH: crates/rdi-python/python
      - run: python -m sphinx -W -n -b dirhtml docs docs/_build/html
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sphinx-html
          path: docs/_build/html
          if-no-files-found: error

  rust-docs:
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install uv==0.12.19
      - run: uv export --locked --only-group docs --no-emit-project --output-file target/uv-docs-requirements.txt
      - run: python -m pip install -r target/uv-docs-requirements.txt
      - run: python scripts/generate-stubs.py --check
      - run: cargo doc --no-deps -p rdi-core -p rdi-platform-windows --target-dir target/docs-rust
      - run: python -m maturin build --release -m crates/rdi-python/Cargo.toml --out target/docs-wheels -i python
      - run: python scripts/check-wheel.py target/docs-wheels
      - shell: pwsh
        run: |
          $wheel = Get-ChildItem target/docs-wheels/*.whl
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pytest crates/rdi-python/tests -v
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rustdoc-html
          path: target/docs-rust/doc
          if-no-files-found: error

  assemble-site:
    runs-on: ubuntu-latest
    needs: [python-docs, rust-docs]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sphinx-html
          path: docs/_build/html
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rustdoc-html
          path: target/docs-rust/doc
      - run: python scripts/assemble-docs.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: combined-documentation
          path: site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        with:
          path: site

  deploy:
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    needs: assemble-site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment

  external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.19
      - run: uv export --locked --only-group docs --no-emit-project --output-file target/uv-docs-requirements.txt
      - run: python -m pip install -r target/uv-docs-requirements.txt
      - run: python -m sphinx -W -n -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: external-link-report
          path: docs/_build/linkcheck