name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p test_publication.py -v
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Check release tag and package versions
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $root = $metadata.packages | Where-Object name -eq 'rusty-desktop-icons'
          $version = $root.version
          if ($env:RELEASE_TAG -cne "v$version") { throw "Release tag must be v$version" }
          foreach ($package in $metadata.packages) {
            if ($package.version -ne $version) { throw "Version mismatch: $($package.name)" }
            foreach ($dependency in $package.dependencies | Where-Object { $_.path }) {
              if ($dependency.req -ne "^$version") { throw "Update the version for $($dependency.name)" }
            }
          }
          $pythonVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('crates/rdi-python/pyproject.toml').read_text())['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -cne $version) { throw 'Python and Cargo versions must match' }
          "version=$version" >> $env:GITHUB_OUTPUT

  wheels:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install maturin==1.15.0
      - name: Build Windows x64 wheel
        run: python -m maturin build --release --locked --manifest-path crates/rdi-python/Cargo.toml --target x86_64-pc-windows-msvc --out dist --interpreter python
      - run: python scripts/check-wheel.py dist
      - name: Install and import the wheel
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $wheel = Get-ChildItem dist/*.whl
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import importlib.metadata, os, rusty_desktop_icons; assert importlib.metadata.version('rusty-desktop-icons') == os.environ['RELEASE_VERSION']"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source distribution
        if: matrix.python == '3.12'
        run: python -m maturin sdist --manifest-path crates/rdi-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  executable:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --workspace --locked
      - run: python -m pip install maturin==1.15.0
      - run: python scripts/generate-stubs.py --check
      - name: Build standalone Windows x64 executable
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --package rusty-desktop-icons --bin animate_timeline --target x86_64-pc-windows-msvc
      - name: Check executable startup without accessing the desktop
        run: ./target/x86_64-pc-windows-msvc/release/animate_timeline.exe --help
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: animate-timeline-windows-x64
          path: target/x86_64-pc-windows-msvc/release/animate_timeline.exe
          if-no-files-found: error

  publish-pypi:
    needs: [wheels, executable]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rusty-desktop-icons/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true

  publish-crates:
    needs: [validate, wheels, executable]
    runs-on: windows-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Authenticate with crates.io trusted publishing
        uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish Rust packages in dependency order
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) { throw 'crates.io trusted publishing did not return a token' }
          foreach ($crate in @('rdi-core', 'rdi-platform-stub', 'rdi-platform-windows', 'rusty-desktop-icons')) {
            $published = $false
            try {
              $response = Invoke-WebRequest "https://crates.io/api/v1/crates/$crate/$env:RELEASE_VERSION" -Headers @{ 'User-Agent' = 'rusty-desktop-icons-release (https://github.com/s0d3s/rusty-desktop-icons)' }
              $published = $response.StatusCode -eq 200
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            }
            if ($published) {
              Write-Output "$crate $env:RELEASE_VERSION already published"
              continue
            }
            cargo publish --locked --package $crate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $crate failed" }
          }

  upload-executable:
    needs: [wheels, executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: animate-timeline-windows-x64
          path: release-assets
      - name: Attach executable to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/animate_timeline.exe --clobber